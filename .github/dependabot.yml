version: 2
updates:
  # `uv`, not `pip`: rdflib and pyshacl are pinned exactly, and the uv ecosystem updates uv.lock
  # in the same pull request instead of leaving it to be relocked by hand.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions are pinned to commit SHAs; Dependabot rewrites the SHA and the trailing tag comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

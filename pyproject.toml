[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rdl-tools"
version = "0.1.0rc4"
description = "Build CLI for RDL ontology modules: validates the RDF, renders the versioned artifact tree, and generates the documentation site's data."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "jamrce" }]
keywords = ["rdf", "ontology", "shacl", "owl", "docusaurus", "w3id", "semantic-web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
]

[project.urls]
Homepage = "https://github.com/jamrce/rdl-tools"
Repository = "https://github.com/jamrce/rdl-tools"
Issues = "https://github.com/jamrce/rdl-tools/issues"
Changelog = "https://github.com/jamrce/rdl-tools/blob/main/CHANGELOG.md"

[project.scripts]
rdl-tools = "rdl_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.5",
    "ruff>=0.6",
    "mypy>=1.11",
    # No `build`: `uv build` is the one build frontend, here and in CI.
    "twine>=5.1",
    # Not a runtime dependency: it keeps the front-matter assertion in tests from skipping.
    "PyYAML",
    "types-PyYAML",
]

# publish

# `explicit = true` keeps TestPyPI out of ordinary resolution; PyPI is uv's default.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# build

[tool.hatch.build.targets.wheel]
packages = ["src/rdl_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

# lint

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",
]
ignore = [
    "RUF001",  # prose and docstrings use typographic dashes on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
docstring-code-format = false

# types

[tool.mypy]
python_version = "3.13"
files = ["src/rdl_tools"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyshacl.*"]
ignore_missing_imports = true

# tests

[tool.pytest.ini_options]
testpaths = ["tests"]
# One suite. Only `network` is opt-in; a `-m` on the command line replaces this one.
addopts = "-q --strict-markers --strict-config -m 'not network'"
markers = ["network: hits a third-party service"]
filterwarnings = ["error::DeprecationWarning:rdl_tools.*"]

[tool.coverage.run]
branch = true
source = ["rdl_tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

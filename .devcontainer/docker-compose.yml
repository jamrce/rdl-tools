services:
  rdl-tools:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached

      # The venv never leaves the container: its interpreter symlinks point into /opt/uv-python.
      - rdl-tools-venv:/workspace/.venv

      # uv's download cache survives a rebuild. A host bind mount on NTFS fails uv's renames.
      - rdl-tools-uv-cache:/home/vscode/.cache/uv

    # For personal tooling that needs to reach something on the host — e.g. a grepai indexer
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rdl-tools-venv:
  rdl-tools-uv-cache:
